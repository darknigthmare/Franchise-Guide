name: Assemble reviewed backlog delivery
on:
  push:
    branches: [feat/backlog-20261107]
    paths: [.delivery/request.json]
permissions:
  contents: write
concurrency:
  group: reviewed-backlog-delivery
  cancel-in-progress: false
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply exact hash-checked source edits
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib, json, pathlib
          root=pathlib.Path.cwd()
          request=json.loads(pathlib.Path('.delivery/request.json').read_text())
          parts=request['parts']
          assert all(p.startswith('.delivery/') and '..' not in pathlib.PurePosixPath(p).parts for p in parts)
          packed=base64.b64decode(''.join(pathlib.Path(p).read_text().strip() for p in parts),validate=True)
          assert hashlib.sha256(packed).hexdigest()==request['sha256'], 'Transport hash mismatch'
          rows=json.loads(gzip.decompress(packed))
          prepared=[]
          for row in rows:
              name=row['path']; path=pathlib.Path(name)
              assert not path.is_absolute() and '..' not in path.parts and '.git' not in path.parts
              assert not path.is_symlink() and path.resolve().is_relative_to(root)
              old=path.read_bytes() if path.exists() else None
              assert (hashlib.sha256(old).hexdigest() if old is not None else None)==row['before'], 'Concurrent change: '+name
              if 'bytes' in row:
                  new=base64.b64decode(row['bytes'],validate=True)
              elif 'text' in row:
                  new=row['text'].encode()
              else:
                  text=old.decode(); edits=row['edits']; previous=0
                  for start,end,value in edits:
                      assert previous<=start<=end<=len(text); previous=end
                  for start,end,value in reversed(edits): text=text[:start]+value+text[end:]
                  new=text.encode()
              assert hashlib.sha256(new).hexdigest()==row['after'], 'Output hash mismatch: '+name
              prepared.append((path,new))
          for path,new in prepared:
              path.parent.mkdir(parents=True,exist_ok=True); path.write_bytes(new)
          for name in parts+['.delivery/request.json']: pathlib.Path(name).unlink()
          print('Verified and applied',len(prepared),'files; transfer files removed.')
          PY
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check:structure
      - run: npm run build:pc
      - run: python3 tests/desktop_http.py && python3 tests/desktop_startup.py
      - name: Commit generated resources without rewriting branch history
        run: |
          # Workflow edits are published separately with the connected GitHub tool.
          # This job keeps only its contents permission; no permission escalation.
          git restore --source=HEAD -- .github/workflows/build.yml
          git config user.name 'FranchiseGuide delivery'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          python3 tools/update_manifest.py
          git add MANIFEST.sha256
          git commit -m 'feat: assemble reviewed 0.37 backlog delivery and reproducible PC package'
          git push origin HEAD:feat/backlog-20261107
      - name: Export exact committed source snapshot
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/delivery"
          git archive --format=zip --prefix=Franchise-Guide/ --output="$RUNNER_TEMP/delivery/FranchiseGuide-source.zip" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/delivery/COMMIT.txt"
          sha256sum "$RUNNER_TEMP/delivery/FranchiseGuide-source.zip" > "$RUNNER_TEMP/delivery/SHA256SUMS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewed-delivery-source
          path: ${{ runner.temp }}/delivery/
          retention-days: 14
          if-no-files-found: error
