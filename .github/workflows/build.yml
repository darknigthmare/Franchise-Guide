name: FranchiseGuide validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web-pc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: npm run check:structure
      - run: npm test
      - run: python3 tests/test_junit_gate.py
      - run: npm run build:pc
      - run: python tests/desktop_http.py && python tests/desktop_startup.py
      - name: Java gateways with controlled HTTP providers
        run: |
          mkdir -p .work/java-tests
          javac --release 17 -d .work/java-tests desktop/src/com/franchiseguide/desktop/*.java tests/*Test.java
          for cls in AutoServicesTest SteamBridgeTest SteamConcurrencyTest SteamAuthTest RetroBridgeTest; do
            java -cp .work/java-tests com.franchiseguide.desktop.$cls
          done
      - uses: actions/upload-artifact@v4
        with:
          name: FranchiseGuide-PC
          path: desktop/dist/FranchiseGuide-PC.jar
          if-no-files-found: error
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: node tests/browser-upgrade.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-origin-results
          path: |
            tests/results/current/browser-origin/
            tests/results/current/browser-upgrade/
          if-no-files-found: warn
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - name: Require non-empty successful native regression results
        run: python3 tools/check_junit_results.py app/build/test-results/testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: Android-debug-after-successful-build
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: app/build/reports/
          if-no-files-found: warn

  android-device:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Enable KVM for the disposable emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Actual Keystore and Compose tests on Android 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: gradle --no-daemon :app:connectedDebugAndroidTest
      - name: Reject missing or skipped device tests
        run: python3 tools/check_junit_results.py app/build/outputs/androidTest-results/connected --instrumented
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-device-evidence
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
